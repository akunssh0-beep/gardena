<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Dashboard Admin - GARDENA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

    <style>
        :root { 
            --primary: #db2777; 
            --accent: #6366f1; 
            --bg: #f8fafc; 
            --card-bg: #ffffff; 
            --text-main: #0f172a; 
            --sat: env(safe-area-inset-top);
            --sab: env(safe-area-inset-bottom);
        }
        
        * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; transition: 0.3s; }
        body { background-color: var(--bg); margin: 0; color: var(--text-main); }

        .admin-container { width: 100%; max-width: 500px; margin: 0 auto; min-height: 100vh; background: var(--bg); padding-bottom: 40px; }

        .header-gradient {
            background: linear-gradient(135deg, #db2777 0%, #6366f1 100%);
            padding: calc(20px + var(--sat)) 24px 40px 24px;
            border-radius: 0 0 40px 40px;
            color: white;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 15px;
            border-radius: 20px;
            text-align: center;
        }

        .main-card {
            background: white;
            margin: -25px 20px 20px 20px;
            padding: 24px;
            border-radius: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        .filter-input {
            width: 100%;
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 12px;
            font-weight: 700;
            outline: none;
        }

        .filter-input:focus { border-color: var(--primary); background: white; }

        .log-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px;
            background: #fff;
            border-radius: 18px;
            margin-bottom: 10px;
            border: 1px solid #f1f5f9;
        }

        .status-pill {
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 9px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .scroll-area { max-height: 400px; overflow-y: auto; scrollbar-width: none; }
        .scroll-area::-webkit-scrollbar { display: none; }

        .skeleton {
            background: #e2e8f0;
            background: linear-gradient(110deg, #eceff1 8%, #f5f5f5 18%, #eceff1 33%);
            background-size: 200% 100%;
            animation: shine 1.5s linear infinite;
        }

        @keyframes shine { to { background-position-x: -200%; } }

        .chart-container { width: 100%; height: 160px; margin-top: 15px; }

        .leaderboard-card {
            background: linear-gradient(135deg, #ffffff 0%, #fdf2f8 100%);
            border: 1px solid #fce7f3;
            border-radius: 24px;
            padding: 20px;
            margin: 20px;
        }
        
        .rank-badge {
            width: 24px; height: 24px;
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 10px; font-weight: 800;
        }
    </style>
</head>
<body>

<div class="admin-container">
    <div class="header-gradient">
        <div class="flex justify-between items-center mb-6">
            <div>
                <h1 class="text-2xl font-black tracking-tighter text-white">ADMIN PANEL</h1>
                <p class="text-[10px] font-bold opacity-80 uppercase tracking-widest text-white">Monitoring GARDENA</p>
            </div>
            <button onclick="manualRefresh()" id="btn-refresh" class="w-10 h-10 bg-white/20 rounded-xl flex items-center justify-center text-white">🔄</button>
        </div>

        <div class="grid grid-cols-2 gap-3 mb-3">
            <div class="stat-card col-span-2">
                <p class="text-[8px] font-black opacity-70 uppercase mb-1 text-white">Persentase Kehadiran Hari Ini</p>
                <h3 id="stat-percent" class="text-3xl font-black text-white">0%</h3>
                <div class="w-full bg-white/20 h-1.5 rounded-full mt-2 overflow-hidden">
                    <div id="stat-progress" class="bg-white h-full transition-all duration-1000" style="width: 0%"></div>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-3 gap-3">
            <div class="stat-card">
                <p class="text-[8px] font-black opacity-70 uppercase mb-1 text-white">Total Nakes</p>
                <h3 id="stat-total" class="text-xl font-black text-white">...</h3>
            </div>
            <div class="stat-card">
                <p class="text-[8px] font-black opacity-70 uppercase mb-1 text-white">Hadir Hari Ini</p>
                <h3 id="stat-hadir" class="text-xl font-black text-white">...</h3>
            </div>
            <div class="stat-card">
                <p class="text-[8px] font-black opacity-70 uppercase mb-1 text-white">Dinas Luar</p>
                <h3 id="stat-dl" class="text-xl font-black text-yellow-300">...</h3>
            </div>
        </div>
        
        <div class="chart-container">
            <canvas id="weeklyChart"></canvas>
        </div>
    </div>

    <div class="leaderboard-card shadow-sm">
        <div class="flex items-center gap-2 mb-4">
            <span class="text-lg">🏆</span>
            <h2 class="text-[11px] font-black text-pink-600 uppercase tracking-widest">Top 5 Disiplin Bulan Ini</h2>
        </div>
        <div id="leaderboard-list" class="space-y-3"></div>
    </div>

    <div class="main-card">
        <div class="flex items-center justify-between mb-4">
            <h2 class="text-xs font-black text-slate-400 uppercase tracking-widest">Kontrol Data</h2>
            <div class="flex gap-2">
                <button onclick="triggerArchive()" class="text-blue-500 font-black text-[10px] uppercase mr-2">Archive</button>
                <button onclick="downloadPDF()" class="text-pink-600 font-black text-[10px] uppercase">PDF</button>
                <button onclick="downloadExcel()" class="text-emerald-500 font-black text-[10px] uppercase">Excel</button>
            </div>
        </div>
        
        <div class="space-y-3">
            <input type="text" id="search-name" oninput="applyFilters()" placeholder="Cari nama petugas..." class="filter-input">
            
            <div class="grid grid-cols-2 gap-2">
                <select id="filter-month" onchange="applyFilters()" class="filter-input">
                    <option value="01">Januari</option><option value="02">Februari</option>
                    <option value="03">Maret</option><option value="04">April</option>
                    <option value="05">Mei</option><option value="06">Juni</option>
                    <option value="07">Juli</option><option value="08">Agustus</option>
                    <option value="09">September</option><option value="10">Oktober</option>
                    <option value="11">November</option><option value="12">Desember</option>
                </select>
                <select id="filter-year" onchange="applyFilters()" class="filter-input">
                    <option value="2025">2025</option><option value="2026">2026</option>
                </select>
            </div>
            
            <select id="filter-status" onchange="applyFilters()" class="filter-input bg-slate-50 border-pink-100">
                <option value="SEMUA">SEMUA STATUS</option>
                <option value="HADIR">HADIR TEPAT WAKTU</option>
                <option value="TERLAMBAT">TERLAMBAT</option>
                <option value="DL">DINAS LUAR (DL)</option>
                <option value="PULANG">PULANG</option>
            </select>
        </div>
    </div>

    <div class="px-5">
        <div class="flex items-center justify-between mb-4 px-2">
            <h2 class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Aktivitas Terbaru</h2>
            <div class="flex items-center gap-2">
                <span id="sync-indicator" class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></span>
                <span class="text-[9px] bg-pink-100 text-pink-600 px-2 py-1 rounded-full font-black uppercase">Live Sync</span>
            </div>
        </div>
        
        <div id="admin-log-list" class="scroll-area"></div>
    </div>

    <div class="mt-10 text-center">
        <button onclick="window.history.back()" class="text-[10px] font-bold text-slate-400 uppercase tracking-widest underline">Kembali ke Aplikasi</button>
    </div>
</div>

<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyDeWZyUvXj3qVOZXviPgN-d42jswXgkm2cvYlA7OBgGSPX-G_rxYti_rJWGVdpmi_f2A/exec";
    let fullData = { officers: [], logs: [] };
    let attendanceChart = null;
    let lastLogCount = 0;

    const alertSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');

    async function initAdmin() {
        if (localStorage.getItem('gardena_user') !== 'ADMIN') {
            window.location.href = "index.html";
            return;
        }
        const now = new Date();
        document.getElementById('filter-month').value = (now.getMonth() + 1).toString().padStart(2, '0');
        document.getElementById('filter-year').value = now.getFullYear();
        await loadData();
        setInterval(() => loadData(true), 30000);
    }

    async function manualRefresh() {
        const btn = document.getElementById('btn-refresh');
        btn.classList.add('animate-spin');
        await loadData();
        setTimeout(() => btn.classList.remove('animate-spin'), 500);
    }

    async function loadData(isSilent = false) {
        if (!isSilent) showSkeletons();
        try {
            const res = await fetch(`${WEB_APP_URL}?action=getData`);
            fullData = await res.json();
            checkNewLogs(fullData.logs);
            updateStats();
            renderChart();
            renderLeaderboard();
            applyFilters();
            const indicator = document.getElementById('sync-indicator');
            indicator.classList.replace('bg-red-500', 'bg-emerald-500');
        } catch (e) {
            console.error(e);
            document.getElementById('sync-indicator').classList.replace('bg-emerald-500', 'bg-red-500');
        }
    }

    function checkNewLogs(logs) {
        if (lastLogCount > 0 && logs.length > lastLogCount) {
            const newLog = logs[0];
            if (newLog.status && newLog.status.toUpperCase().includes("TERLAMBAT")) {
                alertSound.play();
                if (Notification.permission === "granted") {
                    new Notification("🚨 Peringatan GARDENA", {
                        body: `${newLog.name} tercatat TERLAMBAT pada ${newLog.time}`,
                        icon: "icon-192.png"
                    });
                }
            }
        }
        lastLogCount = logs.length;
    }

    function showSkeletons() {
        document.getElementById('stat-total').innerHTML = '<div class="h-6 w-8 skeleton mx-auto rounded"></div>';
        document.getElementById('stat-hadir').innerHTML = '<div class="h-6 w-8 skeleton mx-auto rounded"></div>';
        document.getElementById('stat-dl').innerHTML = '<div class="h-6 w-8 skeleton mx-auto rounded"></div>';
        document.getElementById('admin-log-list').innerHTML = '<div class="h-20 w-full skeleton rounded-2xl mb-3"></div>'.repeat(3);
    }

    function updateStats() {
        const today = new Date().toLocaleDateString('id-ID', { day: '2-digit', month: '2-digit', year: 'numeric' }).replace(/\./g, '/');
        const logsToday = fullData.logs.filter(l => l.date === today);
        const totalNakes = fullData.officers.length;
        const totalHadirToday = logsToday.filter(l => l.type === 'MASUK' || l.type === 'DL').length;
        const totalDL = logsToday.filter(l => l.type === 'DL').length;

        document.getElementById('stat-total').innerText = totalNakes;
        document.getElementById('stat-hadir').innerText = totalHadirToday;
        document.getElementById('stat-dl').innerText = totalDL;

        // Persentase Kehadiran
        const percent = totalNakes > 0 ? Math.round((totalHadirToday / totalNakes) * 100) : 0;
        document.getElementById('stat-percent').innerText = percent + "%";
        document.getElementById('stat-progress').style.width = percent + "%";
    }

    function renderLeaderboard() {
        const currentMonth = document.getElementById('filter-month').value;
        const stats = {};
        fullData.logs.forEach(l => {
            if (l.date.split('/')[1] === currentMonth && (l.type === 'MASUK' || l.type === 'DL')) {
                const isLate = l.status && l.status.toUpperCase().includes("TERLAMBAT");
                if (!stats[l.name]) stats[l.name] = { score: 0, late: 0 };
                stats[l.name].score += isLate ? 0.5 : 1; 
                if (isLate) stats[l.name].late++;
            }
        });
        const top5 = Object.entries(stats).sort((a, b) => b[1].score - a[1].score).slice(0, 5);
        const container = document.getElementById('leaderboard-list');
        container.innerHTML = top5.length ? top5.map(([name, data], i) => `
            <div class="flex items-center justify-between bg-white p-3 rounded-xl border border-pink-50">
                <div class="flex items-center gap-3">
                    <div class="rank-badge ${i===0?'bg-yellow-400 text-white':i===1?'bg-slate-300':i===2?'bg-orange-300':'bg-pink-100 text-pink-600'}">${i+1}</div>
                    <p class="text-[10px] font-black text-slate-700 uppercase">${name}</p>
                </div>
                <p class="text-[9px] font-extrabold text-pink-500">${data.score} Pts</p>
            </div>
        `).join('') : '<p class="text-center text-[9px] text-slate-300 font-bold uppercase">Data belum tersedia</p>';
    }

    function renderChart() {
        const ctx = document.getElementById('weeklyChart').getContext('2d');
        const last7Days = [];
        const attendanceCounts = [];
        for (let i = 6; i >= 0; i--) {
            const d = new Date(); d.setDate(d.getDate() - i);
            const dateStr = d.toLocaleDateString('id-ID', { day: '2-digit', month: '2-digit', year: 'numeric' }).replace(/\./g, '/');
            last7Days.push(d.toLocaleDateString('id-ID', { weekday: 'short' }));
            attendanceCounts.push(fullData.logs.filter(l => l.date === dateStr && (l.type === 'MASUK' || l.type === 'DL')).length);
        }
        if (attendanceChart) attendanceChart.destroy();
        attendanceChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: last7Days,
                datasets: [{
                    data: attendanceCounts,
                    borderColor: '#fff',
                    backgroundColor: 'rgba(255,255,255,0.1)',
                    fill: true, tension: 0.4, pointRadius: 0
                }]
            },
            options: { plugins: { legend: { display: false } }, scales: { x: { ticks: { color: '#fff', font: { size: 8 } }, grid: { display: false } }, y: { display: false } } }
        });
    }

    async function triggerArchive() {
        if (!confirm("Pindahkan data tahun lalu ke lembar cadangan? Proses ini tidak dapat dibatalkan.")) return;
        try {
            document.body.style.opacity = "0.5";
            const res = await fetch(`${WEB_APP_URL}?action=archiveData`);
            const result = await res.json();
            alert(result.message || "Proses Arsip Berhasil.");
            await loadData();
        } catch (e) { alert("Gagal melakukan arsip."); }
        finally { document.body.style.opacity = "1"; }
    }

    async function deleteLog(rowId, petugasName) {
        if (!confirm(`Hapus data absensi milik ${petugasName}? Tindakan ini akan dicatat dalam Log Audit.`)) return;
        try {
            document.body.style.opacity = "0.5";
            // Kirim auditLog melalui parameter action
            await fetch(`${WEB_APP_URL}?action=deleteLog&data=${rowId}&petugas=${encodeURIComponent(petugasName)}&admin=${encodeURIComponent(localStorage.getItem('gardena_user'))}`);
            alert("Data dihapus dan diaudit.");
            await loadData();
        } catch (e) { alert("Gagal menghapus data."); }
        finally { document.body.style.opacity = "1"; }
    }

    function applyFilters() {
        const nameQuery = document.getElementById('search-name').value.toLowerCase();
        const month = document.getElementById('filter-month').value;
        const year = document.getElementById('filter-year').value;
        const statusQuery = document.getElementById('filter-status').value;
        const container = document.getElementById('admin-log-list');

        const filtered = fullData.logs.filter(l => {
            const dp = l.date.split('/');
            const matchesName = l.name.toLowerCase().includes(nameQuery);
            const matchesDate = dp[1] === month && dp[2] === year;
            
            let matchesStatus = true;
            if (statusQuery === "HADIR") matchesStatus = l.type === "MASUK" && (!l.status || !l.status.toUpperCase().includes("TERLAMBAT"));
            else if (statusQuery === "TERLAMBAT") matchesStatus = l.status && l.status.toUpperCase().includes("TERLAMBAT");
            else if (statusQuery === "DL") matchesStatus = l.type === "DL";
            else if (statusQuery === "PULANG") matchesStatus = l.type === "PULANG";

            return matchesName && matchesDate && matchesStatus;
        });

        container.innerHTML = filtered.length ? filtered.map((l, index) => {
            const isTerlambat = l.status && l.status.toUpperCase().includes("TERLAMBAT");
            return `
            <div class="log-item shadow-sm">
                <div class="flex items-center gap-3">
                    <button onclick="deleteLog(${l.row || index}, '${l.name}')" class="w-8 h-8 bg-red-50 rounded-lg flex items-center justify-center text-red-500 text-xs">🗑️</button>
                    <div>
                        <p class="text-xs font-black text-slate-800 uppercase">${l.name}</p>
                        <p class="text-[9px] font-bold text-slate-400 uppercase">${l.date} • ${l.time}</p>
                    </div>
                </div>
                <div class="text-right">
                    <span class="status-pill ${getStatusColor(l.type)}">${l.type}</span>
                    <p class="text-[8px] font-black mt-1 uppercase ${isTerlambat ? 'text-red-500 animate-pulse' : 'text-slate-400'}">${l.status || 'OK'}</p>
                </div>
            </div>
        `}).join('') : '<p class="text-center text-[10px] text-slate-300 py-10 font-bold uppercase">Data kosong</p>';
    }

    function getStatusColor(t) {
        return t==='MASUK'?'bg-emerald-100 text-emerald-600':t==='PULANG'?'bg-pink-100 text-pink-600':t==='DL'?'bg-amber-100 text-amber-600':'bg-slate-100';
    }

    function downloadPDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        const monthName = document.getElementById('filter-month').options[document.getElementById('filter-month').selectedIndex].text;
        doc.setFontSize(14).setFont(undefined, 'bold').text("UPTD PUSKESMAS SAMPANAHAN", 105, 15, { align: 'center' });
        doc.setFontSize(10).setFont(undefined, 'normal').text("Laporan Rekapitulasi Presensi Nakes - GARDENA", 105, 20, { align: 'center' });
        doc.text(`Periode: ${monthName} ${document.getElementById('filter-year').value}`, 105, 25, { align: 'center' });
        doc.line(15, 28, 195, 28);
        const tableData = fullData.logs.filter(l => l.date.split('/')[1] === document.getElementById('filter-month').value)
            .map(l => [l.name, l.date, l.time, l.type, l.status || 'OK', l.note || '-']);
        doc.autoTable({ startY: 35, head: [['Nama Petugas', 'Tanggal', 'Jam', 'Tipe', 'Status', 'Catatan']], body: tableData, theme: 'grid', headStyles: { fillColor: [219, 39, 119] }, styles: { fontSize: 8 } });
        doc.save(`REKAP_GARDENA_${monthName}.pdf`);
    }

    function downloadExcel() {
        const data = fullData.logs.map(l => ({ "Nama": l.name, "Tanggal": l.date, "Jam": l.time, "Tipe": l.type, "Status": l.status, "Catatan": l.note }));
        const ws = XLSX.utils.json_to_sheet(data);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Rekap");
        XLSX.writeFile(wb, `REKAP_GARDENA_${new Date().getTime()}.xlsx`);
    }

    if (Notification.permission !== "granted") Notification.requestPermission();
    window.onload = initAdmin;
</script>
</body>
</html>
