<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Admin Dashboard - GARDENA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@dotlottie/player-component@latest/dist/dotlottie-player.mjs" type="module"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>

    <style>
        :root { --primary: #db2777; --accent: #6366f1; --bg: #f1f5f9; --card-bg: #ffffff; --border-color: #e2e8f0; --text-main: #0f172a; --text-mute: #64748b; }
        .dark { --bg: #020617; --card-bg: #0f172a; --border-color: #1e293b; --text-main: #f8fafc; --text-mute: #94a3b8; }
        * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; transition: 0.3s; }
        body { background-color: var(--bg); height: 100dvh; margin: 0; display: flex; justify-content: center; overflow: hidden; }
        .app-container { width: 100%; max-width: 500px; background: var(--card-bg); height: 100dvh; display: flex; flex-direction: column; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .scrollable-content { flex: 1; overflow-y: auto; padding-bottom: 100px; scrollbar-width: none; }
        .scrollable-content::-webkit-scrollbar { display: none; }

        .pink-header { 
            background: linear-gradient(135deg, #db2777 0%, #be185d 40%, #6366f1 100%); 
            position: relative;
            overflow: hidden;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.25); border-radius: 20px; padding: 12px; text-align: center; color: white;
        }

        .rekap-wrapper { 
            width: 100%; 
            overflow-x: hidden; 
            border-radius: 20px; 
            border: 1px solid var(--border-color); 
        }
        
        .rekap-table { 
            width: 100%; 
            border-collapse: collapse; 
            font-size: 9px; 
            table-layout: fixed; 
        }
        .rekap-table th { background: #f8fafc; padding: 10px 6px; text-align: left; border-bottom: 2px solid #e2e8f0; color: #64748b; font-weight: 800; text-transform: uppercase; }
        .rekap-table td { padding: 10px 6px; border-bottom: 1px solid #f1f5f9; color: var(--text-main); font-weight: 600; word-break: break-word; }

        .status-badge { padding: 4px 8px; border-radius: 8px; font-size: 8px; font-weight: 800; text-transform: uppercase; }
        .badge-present { background: #ecfdf5; color: #10b981; }
        .badge-dl { background: #ecfeff; color: #0891b2; }
        .badge-absent { background: #fff1f2; color: #f43f5e; }

        #custom-alert { position: fixed; top: 24px; left: 50%; transform: translateX(-50%) translateY(-150%); width: 85%; max-width: 360px; background: var(--card-bg); z-index: 2000; padding: 18px 24px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); display: flex; align-items: center; gap: 14px; transition: 0.4s; opacity: 0; border: 1px solid var(--border-color); }
        #custom-alert.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    </style>
</head>
<body>

<div id="custom-alert">
    <div id="alert-icon" class="w-11 h-11 rounded-full flex items-center justify-center bg-slate-50 text-indigo-600 text-xl">🔔</div>
    <div class="flex-1">
        <p id="alert-title" class="text-[10px] font-black uppercase text-slate-400">Info Sistem</p>
        <p id="alert-msg" class="text-[12px] font-bold text-slate-700"></p>
    </div>
</div>

<div id="loading-overlay" class="hidden fixed inset-0 bg-white/90 z-[3000] flex flex-col items-center justify-center">
    <dotlottie-player src="https://lottie.host/62f6b864-7476-4654-a690-3375f4f89d38/L6rA3UfP6z.json" speed="1.5" style="width: 100px; height: 100px;" loop autoplay></dotlottie-player>
    <p id="loading-text" class="text-[9px] font-black uppercase text-slate-500 font-bold mt-2">Menyusun Laporan...</p>
</div>

<div class="app-container">
    <div class="pink-header p-6 pt-12 pb-10 rounded-b-[45px] text-white">
        <div class="flex justify-between items-center mb-6">
            <div class="flex items-center gap-4">
                <button onclick="window.location.href='index.html'" class="w-10 h-10 bg-white/20 backdrop-blur-md rounded-xl flex items-center justify-center">⬅️</button>
                <div>
                    <h2 class="text-xl font-black uppercase leading-tight">Rekap Admin</h2>
                    <p class="text-[9px] font-bold opacity-80 uppercase tracking-widest">Manajemen Kehadiran</p>
                </div>
            </div>
            <button onclick="downloadExcel()" class="bg-emerald-500 text-white px-4 py-2 rounded-xl text-[10px] font-bold shadow-lg flex items-center gap-2">
                📥 EXCEL
            </button>
        </div>

        <div class="grid grid-cols-4 gap-2">
            <div class="glass-card">
                <p class="text-[6px] font-black uppercase opacity-70 mb-1">Total Nakes</p>
                <h4 id="stat-total-petugas" class="text-sm font-black">0</h4>
            </div>
            <div class="glass-card">
                <p class="text-[6px] font-black uppercase opacity-70 mb-1">Masuk</p>
                <h4 id="stat-masuk" class="text-sm font-black">0</h4>
            </div>
            <div class="glass-card">
                <p class="text-[6px] font-black uppercase opacity-70 mb-1">Terlambat</p>
                <h4 id="stat-telat" class="text-sm font-black text-amber-300">0</h4>
            </div>
            <div class="glass-card">
                <p class="text-[6px] font-black uppercase opacity-70 mb-1">Dinas Luar</p>
                <h4 id="stat-dl" class="text-sm font-black text-cyan-300">0</h4>
            </div>
        </div>
    </div>

    <div class="scrollable-content px-6 mt-6">
        <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4">Monitoring Hari Ini</h3>
        <div class="rekap-wrapper bg-white shadow-sm overflow-hidden mb-8">
            <table class="rekap-table">
                <colgroup>
                    <col style="width: 65%;">
                    <col style="width: 35%;">
                </colgroup>
                <thead>
                    <tr>
                        <th>NAMA PETUGAS</th>
                        <th>STATUS</th>
                    </tr>
                </thead>
                <tbody id="today-monitoring-body">
                </tbody>
            </table>
        </div>

        <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4">Riwayat Bulanan</h3>
        <div class="flex gap-2 mb-4">
            <select id="filter-bulan" onchange="renderAdminRekap()" class="w-full bg-white border border-slate-200 p-3 rounded-xl text-[11px] font-bold text-slate-700 outline-none">
                <option value="01">JANUARI</option>
                <option value="02">FEBRUARI</option>
                <option value="03">MARET</option>
                <option value="04">APRIL</option>
                <option value="05">MEI</option>
                <option value="06">JUNI</option>
                <option value="07">JULI</option>
                <option value="08">AGUSTUS</option>
                <option value="09">SEPTEMBER</option>
                <option value="10">OKTOBER</option>
                <option value="11">NOVEMBER</option>
                <option value="12">DESEMBER</option>
            </select>
            <select id="filter-tahun" onchange="renderAdminRekap()" class="bg-white border border-slate-200 p-3 rounded-xl text-[11px] font-bold text-slate-700 outline-none">
                <option value="2025">2025</option>
                <option value="2026">2026</option>
            </select>
        </div>

        <div class="rekap-wrapper bg-white shadow-sm overflow-hidden">
            <table class="rekap-table" id="admin-table">
                <colgroup>
                    <col style="width: 25%;">
                    <col style="width: 20%;">
                    <col style="width: 30%;">
                    <col style="width: 25%;">
                </colgroup>
                <thead>
                    <tr>
                        <th>PETUGAS</th>
                        <th>TANGGAL</th>
                        <th>JAM ABSEN</th>
                        <th>KET.</th>
                    </tr>
                </thead>
                <tbody id="admin-rekap-body">
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyodVwWDRpMBD-0WV2Mib9oGZKEcf3eiLtS6VE193qGT93HAvmenp_Lgl98i8bywrWA/exec";
    
    let state = {
        logs: [],
        officers: []
    };

    function showAlert(title, msg) {
        document.getElementById('alert-title').innerText = title;
        document.getElementById('alert-msg').innerText = msg;
        const alert = document.getElementById('custom-alert');
        alert.classList.add('show');
        setTimeout(() => alert.classList.remove('show'), 4000);
    }

    function showLoading(show) { 
        document.getElementById('loading-overlay').classList.toggle('hidden', !show); 
    }

    function formatTime(rawTime) {
        if (!rawTime) return "-";
        try {
            if (typeof rawTime === 'string' && /^\d{2}:\d{2}$/.test(rawTime)) {
                return rawTime;
            }
            const date = new Date(rawTime);
            if (!isNaN(date.getTime())) {
                return date.toLocaleTimeString('id-ID', { 
                    hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'Asia/Makassar' 
                }).replace('.', ':');
            }
        } catch (e) {}
        return rawTime;
    }

    async function fetchData() {
        showLoading(true);
        try {
            const response = await fetch(`${WEB_APP_URL}?action=getData`);
            const res = await response.json();
            state.logs = res.logs;
            state.officers = res.officers;
            
            const now = new Date();
            document.getElementById('filter-bulan').value = (now.getMonth() + 1).toString().padStart(2, '0');
            document.getElementById('filter-tahun').value = now.getFullYear().toString();
            
            renderTodayMonitoring();
            renderAdminRekap();
            showLoading(false);
        } catch (e) {
            showAlert("Error", "Gagal mengambil data.");
            showLoading(false);
        }
    }

    function renderTodayMonitoring() {
        const tbody = document.getElementById('today-monitoring-body');
        const now = new Date();
        const todayStr = now.toLocaleDateString('id-ID', { day: '2-digit', month: '2-digit', year: 'numeric', timeZone: 'Asia/Makassar' }).replace(/\./g, '/');
        
        // Filter log hari ini
        const logsToday = state.logs.filter(l => l.date === todayStr);

        tbody.innerHTML = state.officers.map(name => {
            const personalLogs = logsToday.filter(l => l.name === name);
            const isDL = personalLogs.some(l => l.type === 'DL');
            const isPresent = personalLogs.length > 0;

            let badgeClass = "badge-absent";
            let statusLabel = "Belum Absen";

            if (isDL) {
                badgeClass = "badge-dl";
                statusLabel = "DL";
            } else if (isPresent) {
                badgeClass = "badge-present";
                statusLabel = "Sudah Absen";
            }

            return `
                <tr>
                    <td class="font-bold text-slate-700 truncate">${name}</td>
                    <td>
                        <span class="status-badge ${badgeClass}">
                            ${statusLabel}
                        </span>
                    </td>
                </tr>
            `;
        }).join('');

        document.getElementById('stat-total-petugas').innerText = state.officers.length;
    }

    function renderAdminRekap() {
        const tbody = document.getElementById('admin-rekap-body');
        const filterBulan = document.getElementById('filter-bulan').value;
        const filterTahun = document.getElementById('filter-tahun').value;
        
        let countMasuk = 0;
        let countTelat = 0;
        let countDL = 0;

        const grouped = {};
        state.logs.forEach(l => {
            const parts = l.date.split('/');
            if (parts[1] !== filterBulan || parts[2] !== filterTahun) return;

            const key = `${l.date}_${l.name}`;
            if (!grouped[key]) grouped[key] = { name: l.name, date: l.date, masuk: "-", pulang: "-", status: "-" };
            
            const time = formatTime(l.time);
            if (l.type === "MASUK") {
                grouped[key].masuk = time;
                grouped[key].status = l.status;
                countMasuk++;
                if(l.status.includes("TERLAMBAT")) countTelat++;
            } else if (l.type === "PULANG") {
                grouped[key].pulang = time;
            } else if (l.type === "DL") {
                grouped[key].masuk = "-";
                grouped[key].pulang = "-";
                grouped[key].status = "DL";
                countDL++;
            }
        });

        const sortedKeys = Object.keys(grouped).sort((a,b) => b.localeCompare(a));
        
        tbody.innerHTML = sortedKeys.length > 0 ? sortedKeys.map(k => {
            const r = grouped[k];
            let statusColor = "text-emerald-500";
            if (r.status.includes("TERLAMBAT")) statusColor = "text-amber-500";
            if (r.status === "DL") statusColor = "text-cyan-500";

            const jamDisplay = r.status === "DL" ? "- - -" : `${r.masuk} - ${r.pulang}`;

            return `
                <tr>
                    <td class="font-bold text-slate-700 truncate">${r.name}</td>
                    <td>${r.date.substring(0, 5)}</td>
                    <td class="font-mono text-[8px]">${jamDisplay}</td>
                    <td><span class="${statusColor} font-black uppercase text-[7px]">${r.status}</span></td>
                </tr>
            `;
        }).join('') : '<tr><td colspan="4" class="text-center py-20 text-slate-300 font-bold uppercase">Tidak ada data</td></tr>';

        document.getElementById('stat-masuk').innerText = countMasuk;
        document.getElementById('stat-telat').innerText = countTelat;
        document.getElementById('stat-dl').innerText = countDL;
    }

    function downloadExcel() {
        const table = document.getElementById('admin-table');
        const wb = XLSX.utils.table_to_book(table, { sheet: "Rekap Kehadiran" });
        const bulan = document.getElementById('filter-bulan').options[document.getElementById('filter-bulan').selectedIndex].text;
        const tahun = document.getElementById('filter-tahun').value;
        XLSX.writeFile(wb, `REKAP_GARDENA_ALL_${bulan}_${tahun}.xlsx`);
    }

    window.onload = fetchData;
</script>
</body>
</html>
